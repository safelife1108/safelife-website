<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Safe Life Diagnostic Centre</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  background: #0b1220;
  color: #ffffff;
  overflow-x: hidden;
}

/* HEADER */
header {
  position: fixed;
  top: 0;
  width: 100%;
  background: rgba(10, 15, 30, 0.8);
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 30px;
  z-index: 1000;
}

header img {
  height: 40px;
}

nav a {
  color: #ffffff;
  text-decoration: none;
  margin-left: 20px;
  font-weight: 600;
  opacity: 0.9;
}

nav a:hover {
  opacity: 1;
  color: #4da3ff;
}

/* HERO */
.hero {
  height: 100vh;
  width: 100%;
  position: relative;
  perspective: 1000px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Background gradient layer */
.layer.bg {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top right, #1e3a8a, #020617 60%);
  transform: translateZ(-200px) scale(1.2);
}

/* Floating shapes */
.layer.shape1 {
  position: absolute;
  width: 300px;
  height: 300px;
  background: linear-gradient(135deg, #2563eb, #38bdf8);
  border-radius: 50%;
  top: 20%;
  left: 15%;
  filter: blur(40px);
  opacity: 0.6;
  transform: translateZ(-100px);
}

.layer.shape2 {
  position: absolute;
  width: 400px;
  height: 400px;
  background: linear-gradient(135deg, #dc2626, #f97316);
  border-radius: 50%;
  bottom: 10%;
  right: 10%;
  filter: blur(50px);
  opacity: 0.5;
  transform: translateZ(-150px);
}

/* Grid lines layer */
.layer.grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 60px 60px;
  transform: translateZ(-50px);
}

/* Content */
.hero-content {
  position: relative;
  text-align: center;
  z-index: 10;
  transform: translateZ(100px);
}

.hero-content h1 {
  font-size: 56px;
  margin-bottom: 15px;
  letter-spacing: 1px;
}

.hero-content p {
  font-size: 20px;
  opacity: 0.85;
  margin-bottom: 30px;
}

.hero-content .btn {
  display: inline-block;
  padding: 14px 32px;
  border-radius: 30px;
  background: linear-gradient(135deg, #2563eb, #38bdf8);
  color: #fff;
  text-decoration: none;
  font-weight: bold;
  box-shadow: 0 10px 30px rgba(56,189,248,0.4);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.hero-content .btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 40px rgba(56,189,248,0.6);
}

/* Parallax container */
.parallax {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

/* Sections placeholder */
section {
  padding: 100px 20px;
  text-align: center;
  background: #020617;
}

section h2 {
  color: #4da3ff;
  margin-bottom: 10px;
}

/* Footer */
footer {
  background: #020617;
  color: #aaa;
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>

<header>
  <div>
    <!-- You can keep your logo later -->
    <strong>Safe Life</strong>
  </div>
  <nav>
    <a href="#">Home</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<div class="hero">
  <div class="parallax" id="parallax">

    <div class="layer bg"></div>
    <div class="layer shape1"></div>
    <div class="layer shape2"></div>
    <div class="layer grid"></div>

    <div class="hero-content">
      <h1>Safe Life Diagnostic Centre</h1>
      <p>Precision • Trust • Modern Diagnostics</p>
      <a href="#contact" class="btn">Book a Test</a>
    </div>

  </div>
</div>

<section id="services">
  <h2>Our Services</h2>
  <p>Blood Tests • X-Ray • Sonography • ECG • 2D Echo</p>
</section>

<section id="contact">
  <h2>Contact Us</h2>
  <p>📞 9326602540</p>
</section>

<footer>
  <p>© 2026 Safe Life Diagnostic Centre</p>
</footer>

<script>
const parallax = document.getElementById("parallax");
const layers = parallax.querySelectorAll(".layer, .hero-content");

document.addEventListener("mousemove", (e) => {
  const x = (e.clientX / window.innerWidth - 0.5) * 20;
  const y = (e.clientY / window.innerHeight - 0.5) * 20;

  layers.forEach((layer, i) => {
    const depth = (i + 1) * 10;
    layer.style.transform = `translateX(${ -x * depth / 10 }px) translateY(${ -y * depth / 10 }px) translateZ(${(i - 2) * 50}px)`;
  });
});
</script>

</body>
</html>
